events { worker_connections 4096; }

http {
  # L7 load balancer across 3 gateway instances.
  #
  # hash $request_uri consistent  == consistent hashing on the URL, which for
  # /price/:sku means the SAME SKU ALWAYS LANDS ON THE SAME INSTANCE.
  #
  # Why that matters here: L1 cache and in-flight de-dup are per-instance.
  # With round-robin, 3 instances each keep their own copy of every hot SKU
  # and each can issue its own upstream call for it. With SKU affinity, one
  # instance owns each SKU, so L1 hit rate and de-dup effectiveness are
  # restored almost to single-instance levels.
  #
  # The cost is HOTSPOTS: one viral SKU melts one instance while the others
  # idle. Round-robin spreads load evenly but destroys cache locality.
  # This is the central trade in partitioned caches, and naming it is the
  # point of building it this way.
  #
  # "consistent" uses ketama hashing so adding/removing an instance remaps
  # only ~1/N of keys instead of reshuffling everything.
  upstream gateways {
    hash $request_uri consistent;
    server host.docker.internal:4001;
    server host.docker.internal:4002;
    server host.docker.internal:4003;
  }

  server {
    listen 4100;
    location / {
      proxy_pass http://gateways;
      proxy_set_header X-Instance $upstream_addr;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }
  }
}
